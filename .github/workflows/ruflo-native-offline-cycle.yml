name: RuFlo - native coordination offline lifecycle
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-native-offline-cycle.mjs
      - .github/workflows/ruflo-native-offline-cycle.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUFLO_VERSION: '3.56.10'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      CODEX_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DATABASE_URL: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - name: Checkout only RuFlo hub without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate script and hub
        run: |
          node --check scripts/ruflo-native-offline-cycle.mjs
          npm run validate
          npm test
      - name: Install pinned RuFlo without install scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Probe native three-role task lifecycle with NO model credentials
        run: node scripts/ruflo-native-offline-cycle.mjs
      - name: Ensure main source is not modified
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
