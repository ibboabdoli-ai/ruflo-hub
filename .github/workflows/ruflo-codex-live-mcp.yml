name: RuFlo - Codex real MCP read-only tool invocation
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-codex-live-mcp.mjs
      - .github/workflows/ruflo-codex-live-mcp.yml
permissions:
  contents: read
jobs:
  one-native-tool:
    if: >-
      github.repository == 'ibboabdoli-ai/ruflo-hub' &&
      github.ref == 'refs/heads/work/ruflo-three-agent-lab-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUFLO_VERSION: "3.56.10"
      CODEX_VERSION: "0.163.0"
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
      VERCEL_TOKEN: ""
    steps:
      - name: Checkout audited lab source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax check test harness before loading API key
        run: node --check scripts/ruflo-codex-live-mcp.mjs
      - name: Install pinned clients without API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo" "$RUNNER_TEMP/codex"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          npm install --prefix "$RUNNER_TEMP/codex" --no-save --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
          echo "CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Run one paid, time-bounded Codex MCP tool test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ruflo-codex-live-mcp.mjs
      - name: Ensure test made no repository modifications
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
