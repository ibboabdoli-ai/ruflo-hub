name: RuFlo - Codex read-only bridge preflight (no paid calls)
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-codex-live-mcp.mjs
      - scripts/ruflo-readonly-facade.mjs
      - scripts/ruflo-readonly-facade-smoke.mjs
      - lib/codex-mcp-proof.mjs
      - tests/codex-mcp-proof.test.mjs
      - .github/workflows/ruflo-codex-live-mcp.yml
permissions:
  contents: read
jobs:
  no-credential-preflight:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUFLO_VERSION: '3.56.10'
      OPENAI_API_KEY: ''
      CODEX_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - name: Checkout isolated lab without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate offline source and Codex receipt parser without credentials
        run: |
          npm run validate
          npm test
          node --check scripts/ruflo-codex-live-mcp.mjs
          node --check scripts/ruflo-readonly-facade.mjs
          node --check scripts/ruflo-readonly-facade-smoke.mjs
      - name: Install pinned RuFlo without scripts or credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Credential-free MCP handshake, exact tool inventory and deny-write smoke
        run: node scripts/ruflo-readonly-facade-smoke.mjs
      - name: Check tracked AND untracked files
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
# Deliberately no secret-bearing or paid Codex execution step.
# Owner must separately provision and verify a GitHub Environment with required
# reviewer approval, and a hard upstream token/request budget, before enabling it.
