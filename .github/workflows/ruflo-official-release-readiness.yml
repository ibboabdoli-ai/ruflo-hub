name: RuFlo official release readiness - isolated security gate
on:
  push:
    branches:
      - work/ruflo-official-3714-isolated-20261105
    paths:
      - scripts/ruflo-release-readiness.mjs
      - .github/workflows/ruflo-official-release-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-release:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-official-3714-isolated-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      RUFLO_CANDIDATE: '3.71.4'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      CODEX_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DATABASE_URL: ''
      BLOB_READ_WRITE_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout only public Hub without saving credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static source checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ruflo-release-readiness.mjs
          npm run validate
          npm test
      - name: Verify independent npm publication metadata (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for pkg in @claude-flow/cli-core @claude-flow/shared @claude-flow/security ruflo; do
            echo "NPM_DIST_TAG_QUERY package=$pkg"
            npm view "$pkg" dist-tags --json
            echo "NPM_PACKAGE_VERSION_QUERY package=$pkg"
            npm view "$pkg" version --json
          done
      - name: Install official published candidate in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-official"
          cd "$RUNNER_TEMP/ruflo-official"
          printf '{"name":"ruflo-official-isolated-gate","private":true,"version":"0.0.0","dependencies":{"ruflo":"%s","@metaharness/router":"0.4.0"}}\n' "$RUFLO_CANDIDATE" > package.json
          # Candidate research only: temp lock is created for reproducible npm audit.
          # It is NOT a reviewed, committed integrity-pinned production lockfile.
          npm install --package-lock-only --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund
          test -f node_modules/ruflo/package.json
          test -f package-lock.json
      - name: Check runtime Zod and security negative paths - fail closed
        shell: bash
        env:
          RUFLO_RELEASE_INSTALL: ${{ runner.temp }}/ruflo-official
        run: |
          set -euo pipefail
          node scripts/ruflo-release-readiness.mjs
      - name: Audit installed non-optional dependencies - fail on high or critical
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-official"
          npm audit --omit=dev --omit=optional --json > "$RUNNER_TEMP/ruflo-official-audit.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ruflo-official-audit.json','utf8'));
          if(report.error||!report.metadata?.vulnerabilities)throw Error('Audit unavailable; fail closed');
          const v=report.metadata.vulnerabilities;
          console.log('RUFLO_OFFICIAL_AUDIT '+JSON.stringify(v));
          if((v.high||0)+(v.critical||0)>0)throw Error('Official candidate blocked: high or critical advisories');
          NODE
      - name: Document scope and preserve repository checkout
        if: always()
        shell: bash
        run: |
          {
            echo '## Official RuFlo release — research-only readiness gate'
            echo "Candidate: $RUFLO_CANDIDATE"
            echo 'No Proffera source, booking data, Supervisor, provider keys, or paid AI calls were used.'
            echo 'A successful focused check alone is NOT production approval; pinned lockfile, full upstream CI and security review are required.'
            echo 'The original Zod override on Draft PR #10 remains a separate known blocker.'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
