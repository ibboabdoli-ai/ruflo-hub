name: One-time Receipt AI public dependency lock bootstrap
on:
  push:
    branches:
      - work/ruflo-sonar-main-dashboard-20261024
    paths:
      - .github/workflows/receipt-lock-bootstrap.yml
permissions:
  contents: read
jobs:
  generate-lock:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-sonar-main-dashboard-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - name: Checkout exact public Receipt AI source (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibboabdoli-ai/Ibbo_Receipt_AI
          ref: fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2
          persist-credentials: false
      - name: Confirm external source is pinned
        shell: bash
        run: test "$(git rev-parse HEAD)" = "fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2"
      - name: Use source-required Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate deterministic integrity lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lock covers exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(l.lockfileVersion<2||JSON.stringify(l.packages[''].dependencies)!==JSON.stringify(p.dependencies)||JSON.stringify(l.packages[''].devDependencies)!==JSON.stringify(p.devDependencies))process.exit(1)"
      - name: Commit only the generated public lock to isolated diagnostic branch
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,json,urllib.request
          repository='ibboabdoli-ai/ruflo-hub'
          branch='work/ruflo-sonar-main-dashboard-20261024'
          path='locks/receipt-ai/package-lock.json'
          token=os.environ['GH_WRITE_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ruflo-isolated-receipt-lock'}
          def call(url,method='GET',data=None):
              request=urllib.request.Request(url,headers=headers,data=data,method=method)
              with urllib.request.urlopen(request,timeout=18) as response:return json.loads(response.read())
          ref=call('https://api.github.com/repos/'+repository+'/git/ref/heads/'+branch)
          if ref['object']['sha']!=os.environ['GITHUB_SHA']:raise RuntimeError('Branch advanced; fail closed')
          lock=open('package-lock.json','rb').read()
          if not (1000<len(lock)<1800000):raise RuntimeError('Unexpected lock size')
          content=base64.b64encode(lock).decode('ascii')
          payload={'message':'build: pin public Receipt AI dependency tree for native smoke tests','content':content,'branch':branch}
          output=call('https://api.github.com/repos/'+repository+'/contents/'+path,'PUT',json.dumps(payload).encode('utf-8'))
          print('LOCK_BOOTSTRAPPED',len(lock),'bytes, content_sha',output['content']['sha'],'commit',output['commit']['sha'])
          PY
