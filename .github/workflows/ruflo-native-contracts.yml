name: RuFlo - native agent coordination contract discovery (no keys)
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-native-contracts.mjs
      - .github/workflows/ruflo-native-contracts.yml
permissions:
  contents: read
jobs:
  contract-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RUFLO_VERSION: '3.56.10'
      OPENAI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DATABASE_URL: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - name: Checkout only disconnected RuFlo lab source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check script syntax and hub unit tests without dependencies
        run: |
          node --check scripts/ruflo-native-contracts.mjs
          npm run validate
          npm test
      - name: Install RuFlo pinned with lifecycle scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Inspect real MCP task and agent tool contracts, no model or writes
        run: node scripts/ruflo-native-contracts.mjs
      - name: Verify hub source unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
