name: RuFlo candidate security trial - lab only
on:
  push:
    branches:
      - work/ruflo-offline-benchmark-20261025
    paths:
      - .github/workflows/ruflo-security-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-offline-benchmark-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      CODEX_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Read-only checkout of public synthetic bench
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify repository baseline
        run: |
          set -euo pipefail
          npm run validate
          npm test
      - name: Install exact newer RuFlo candidate in disposable directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-candidate"
          cd "$RUNNER_TEMP/ruflo-candidate"
          npm install --save-exact --ignore-scripts --no-audit --no-fund "ruflo@3.63.3" "@metaharness/router@0.4.0"
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/ruflo
          node -p '"CANDIDATE_VERSION "+require("./node_modules/ruflo/package.json").version'
          sha256sum package-lock.json
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo-candidate/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Inventory candidate advisories without changing dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-candidate"
          npm audit --omit=dev --json > "$RUNNER_TEMP/ruflo-candidate-audit.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ruflo-candidate-audit.json','utf8'));
          if (report.error || !report.metadata?.vulnerabilities) throw Error('Audit data unavailable');
          const counts=report.metadata.vulnerabilities;
          const severe=Object.entries(report.vulnerabilities||{}).filter(([,v])=>v.severity==='high'||v.severity==='critical')
            .map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}));
          console.log('CANDIDATE_AUDIT_COUNTS '+JSON.stringify(counts));
          console.log('CANDIDATE_SEVERE_PACKAGES '+JSON.stringify(severe));
          NODE
      - name: Check actual three-role RuFlo MCP behavior with no provider credentials
        run: node benchmarks/offline/bench.mjs ruflo
      - name: Enforce zero critical and high dependency warnings for candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ruflo-candidate-audit.json','utf8'));
          const counts=data.metadata?.vulnerabilities;
          if (!counts || data.error) throw Error('Missing audit result');
          if ((counts.high||0)+(counts.critical||0)>0) throw Error('Candidate remains blocked by high/critical npm advisories');
          console.log('Candidate dependency high/critical gate PASS');
          NODE
      - name: Ensure public Hub worktree unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
