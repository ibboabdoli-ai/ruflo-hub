name: RuFlo - Codex native MCP handshake (no credentials)
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-codex-mcp-handshake.mjs
      - .github/workflows/ruflo-codex-mcp-handshake.yml
permissions:
  contents: read
jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RUFLO_VERSION: "3.56.10"
      CODEX_VERSION: "0.163.0"
      OPENAI_API_KEY: ""
      CODEX_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
      VERCEL_TOKEN: ""
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned disposable tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo" "$RUNNER_TEMP/codex"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          npm install --prefix "$RUNNER_TEMP/codex" --no-save --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
          test -x "$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo"
          test -x "$RUNNER_TEMP/codex/node_modules/.bin/codex"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
          echo "CODEX_BIN=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Test RuFlo MCP server and Codex local server registration
        run: node scripts/ruflo-codex-mcp-handshake.mjs
      - name: Confirm no checked-out files were modified
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
