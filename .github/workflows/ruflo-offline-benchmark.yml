name: RuFlo benchmark - zero-key isolated task coordination
on:
  workflow_dispatch:
  push:
    branches:
      - work/ruflo-offline-benchmark-20261025
    paths:
      - benchmarks/offline/**
      - tests/ruflo-offline-benchmark.test.mjs
      - .github/workflows/ruflo-offline-benchmark.yml
permissions:
  contents: read
jobs:
  offline-benchmark:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-offline-benchmark-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      CODEX_API_KEY: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout public Hub only; no saved credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static safety + all offline regression tests
        run: |
          set -euo pipefail
          node --check benchmarks/offline/bench.mjs
          npm run validate
          npm test
      - name: Run static direct baseline with no model
        run: node benchmarks/offline/bench.mjs direct
      - name: Create a fresh npm lock with actual install, then verify npm ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-lock-review"
          cd "$RUNNER_TEMP/ruflo-lock-review"
          # 'npm install --package-lock-only' generated a lock npm ci rejected;
          # generate the tree using an actual installation instead.
          # RuFlo's CLI peers require @metaharness/router ^0.4.0, while
          # optional ruvector needs 0.3.2. Pin the peer at the root so npm
          # can place 0.3.2 in ruvector's nested dependency tree.
          npm install --save-exact --ignore-scripts --no-audit --no-fund "ruflo@3.56.10" "@metaharness/router@0.4.0"
          test -s package-lock.json
          test -x node_modules/.bin/ruflo
          sha256sum package-lock.json
          # Fail if npm cannot reproduce the newly generated complete lock.
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/ruflo
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo-lock-review/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Upload complete npm-ci-tested lock for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruflo-lock-review
          path: ${{ runner.temp }}/ruflo-lock-review/package-lock.json
          retention-days: 7
      - name: Export synthetic public dependency lock for repository archiving
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-lock-review"
          echo "e5b933a3a500f55da3c81f9d0d3280f334de70998187e29d2e4bdac2de34e1b7  package-lock.json" | sha256sum --check
          echo RUFLO_LOCK_CONTENT_START_V1
          cat package-lock.json
          echo RUFLO_LOCK_CONTENT_END_V1
      - name: Exercise real three-role RuFlo task bookkeeping without inference
        run: node benchmarks/offline/bench.mjs ruflo
      - name: Verify Hub source tree was never mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
