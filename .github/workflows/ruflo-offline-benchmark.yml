name: RuFlo benchmark - zero-key isolated task coordination
on:
  workflow_dispatch:
  push:
    branches:
      - work/ruflo-offline-benchmark-20261025
    paths:
      - benchmarks/offline/**
      - tests/ruflo-offline-benchmark.test.mjs
      - .github/workflows/ruflo-offline-benchmark.yml
permissions:
  contents: read
jobs:
  offline-benchmark:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-offline-benchmark-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      CODEX_API_KEY: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout public Hub only; no saved credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static safety + all offline regression tests
        run: |
          set -euo pipefail
          node --check benchmarks/offline/bench.mjs
          npm run validate
          npm test
      - name: Run static direct baseline with no model
        run: node benchmarks/offline/bench.mjs direct
      - name: Install pinned RuFlo and reviewed lab-only Zod v4 override without optional ML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-benchmark-cli"
          cp benchmarks/offline/deps/package.json benchmarks/offline/deps/package-lock.json "$RUNNER_TEMP/ruflo-benchmark-cli/"
          cd "$RUNNER_TEMP/ruflo-benchmark-cli"
          echo "8ad21bc4f4a95d756cd9bcfae962625f2e7f03881c7719e25443f73ddbabcc44  package-lock.json" | sha256sum --check
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/ruflo
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo-benchmark-cli/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Exercise real three-role RuFlo task bookkeeping without inference
        run: node benchmarks/offline/bench.mjs ruflo
      - name: Verify Hub source tree was never mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Audit locked RuFlo runtime dependencies for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-benchmark-cli"
          # npm audit has exit code 1 when it reports vulnerabilities.
          # Parse JSON independently and fail closed on errors or high/critical findings.
          npm audit --omit=dev --omit=optional --json > "$RUNNER_TEMP/ruflo-dependency-audit.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const raw = readFileSync(process.env.RUNNER_TEMP+'/ruflo-dependency-audit.json','utf8');
          const report=JSON.parse(raw);
          if (report.error || !report.metadata?.vulnerabilities) {
            throw Error('npm audit result unavailable or invalid');
          }
          const v=report.metadata.vulnerabilities;
          const rows=Object.entries(report.vulnerabilities || {})
            .filter(([,entry])=>['critical','high'].includes(entry.severity))
            .map(([name,entry])=>name+' ('+entry.severity+')');
          console.log('RUFLO_DEPENDENCY_AUDIT '+JSON.stringify({counts:v,highOrCriticalPackages:rows}));
          const critical = Object.entries(report.vulnerabilities || {})
            .filter(([,entry])=>entry.severity==='critical')
            .map(([name,entry])=>({
              name, range:entry.range, fixAvailable:entry.fixAvailable,
              isDirect:entry.isDirect,
              via:(entry.via||[]).map(x=>typeof x==='string'?{name:x}:
                {name:x.name,title:x.title,severity:x.severity,
                 range:x.range,url:x.url,source:x.source})
            }));
          console.log('RUFLO_CRITICAL_AUDIT_DETAILS '+JSON.stringify(critical));
          if (process.env.GITHUB_STEP_SUMMARY) {
            const {appendFileSync}=await import('node:fs');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '\n## Locked RuFlo dependencies – npm audit\n'+
              '- High: '+(v.high||0)+'; Critical: '+(v.critical||0)+
              '; Moderate: '+(v.moderate||0)+'; Low: '+(v.low||0)+'\n'+
              '- High/critical packages: '+(rows.join(', ')||'none')+'\n');
          }
          if ((v.high||0)+(v.critical||0)>0) {
            throw Error('Dependency audit release gate: high or critical vulnerabilities found');
          }
          NODE
      - name: Check upstream Zod v4 runtime validation compatibility - fail closed
        shell: bash
        env:
          RUFLO_COMPAT_INSTALL: ${{ runner.temp }}/ruflo-benchmark-cli
        run: |
          set -euo pipefail
          node --check benchmarks/offline/zod-compat.mjs
          node benchmarks/offline/zod-compat.mjs
