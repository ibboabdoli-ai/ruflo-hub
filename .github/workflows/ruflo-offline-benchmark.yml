name: RuFlo benchmark - zero-key isolated task coordination
on:
  workflow_dispatch:
  push:
    branches:
      - work/ruflo-offline-benchmark-20261025
    paths:
      - benchmarks/offline/**
      - tests/ruflo-offline-benchmark.test.mjs
      - .github/workflows/ruflo-offline-benchmark.yml
permissions:
  contents: read
jobs:
  offline-benchmark:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/ruflo-offline-benchmark-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      CODEX_API_KEY: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout public Hub only; no saved credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static safety + all offline regression tests
        run: |
          set -euo pipefail
          node --check benchmarks/offline/bench.mjs
          npm run validate
          npm test
      - name: Run static direct baseline with no model
        run: node benchmarks/offline/bench.mjs direct
      - name: Resolve temporary RuFlo dependency tree for review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-lock-review"
          cd "$RUNNER_TEMP/ruflo-lock-review"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact "ruflo@3.56.10"
          test -s package-lock.json
          sha256sum package-lock.json
      - name: Upload generated lock before integrity gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruflo-lock-review
          path: ${{ runner.temp }}/ruflo-lock-review/package-lock.json
          retention-days: 3
      - name: Verify reviewed dependency hash and install via npm ci
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ruflo-lock-review"
          echo "15addfc7bdf65f53d5d61a45896403f6989bd5855d8b2e869340aae3eed68f56  package-lock.json" | sha256sum --check
          npm ci --ignore-scripts --no-audit --no-fund
          test -x "node_modules/.bin/ruflo"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo-lock-review/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Exercise real three-role RuFlo task bookkeeping without inference
        run: node benchmarks/offline/bench.mjs ruflo
      - name: Verify Hub source tree was never mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
