name: Validate RuFlo Hub configuration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reject hidden Actions YAML secrets mappings
        run: |
          ruby --version
          ruby -c scripts/check-workflow-secrets.rb
          ruby scripts/check-workflow-secrets.rb
      - run: npm run validate
      - run: npm test
      - name: Syntax-check every maintained script and test
        run: |
          for file in scripts/*.mjs lib/*.mjs tests/*.mjs; do
            node --check "$file"
          done
