name: Diagnose SonarCloud public PR findings
on:
  push:
    branches: [work/ruflo-proffera-public-mcp-20261024]
    paths:
      - .github/workflows/sonar-pr4-diagnostic.yml
permissions:
  contents: read
jobs:
  public-sonar-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only public SonarCloud issue metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,urllib.error
          params=urllib.parse.urlencode({'componentKeys':'ibboabdoli-ai_ruflo-hub','pullRequest':'4','ps':'100','types':'VULNERABILITY'})
          url='https://sonarcloud.io/api/issues/search?'+params
          request=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ruflo-hub-public-diagnostic'})
          try:
              with urllib.request.urlopen(request,timeout=12) as response:
                  data=json.loads(response.read(250000))
          except urllib.error.HTTPError as exc:
              print('SONAR_DIAGNOSTIC_NOT_VERIFIED HTTP',exc.code)
              raise SystemExit(0)
          except Exception as exc:
              print('SONAR_DIAGNOSTIC_NOT_VERIFIED',type(exc).__name__)
              raise SystemExit(0)
          items=data.get('issues',[])
          print('SONAR_REPORTED_ISSUES',len(items),'total',data.get('total'))
          for item in items[:30]:
              record={key:item.get(key) for key in ('rule','component','line','message','severity','type','status','impacts')}
              print('SONAR_FINDING',json.dumps(record,ensure_ascii=True)[:1800])
          PY
