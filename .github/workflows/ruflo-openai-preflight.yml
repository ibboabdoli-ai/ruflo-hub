name: RuFlo lab - OpenAI key connectivity (no paid calls)
on:
  push:
    branches:
      - work/ruflo-three-agent-lab-20261018
    paths:
      - scripts/ruflo-openai-preflight.mjs
      - .github/workflows/ruflo-openai-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openai-preflight:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ibboabdoli-ai/ruflo-hub' &&
      github.ref == 'refs/heads/work/ruflo-three-agent-lab-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout checked test script without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node.js version
        run: node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1)"
      - name: Test secret and provider metadata without paid requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ruflo-openai-preflight.mjs
      - name: Check that repository was not modified
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
