name: RuFlo - three-agent registration lab (no model keys)
on:
  workflow_dispatch:
  push:
    branches:
      - work/ruflo-three-agent-lab-20261018
    paths:
      - scripts/ruflo-three-agent-lab.mjs
      - .github/workflows/ruflo-three-agent-lab.yml

permissions:
  contents: read

concurrency:
  group: ruflo-three-agent-lab
  cancel-in-progress: false

jobs:
  no-key-agent-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      RUFLO_VERSION: "3.56.10"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      CLAUDE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
      VERCEL_TOKEN: ""
    steps:
      - name: Checkout hub source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run hub policy and unit tests
        run: |
          npm run validate
          npm test
      - name: Install pinned RuFlo in temporary directory without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo-install"
          npm install --prefix "$RUNNER_TEMP/ruflo-install" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          test -x "$RUNNER_TEMP/ruflo-install/node_modules/.bin/ruflo"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo-install/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Create a temporary swarm and register three agent roles
        run: node scripts/ruflo-three-agent-lab.mjs
      - name: Verify hub code was not modified
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
