name: RuFlo - read-only MCP facade no-key validation
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-readonly-facade.mjs
      - scripts/ruflo-readonly-facade-smoke.mjs
      - .github/workflows/ruflo-readonly-facade.yml
permissions:
  contents: read
jobs:
  facade:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RUFLO_VERSION: "3.56.10"
      OPENAI_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      VERCEL_TOKEN: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
    steps:
      - name: Checkout only the sandbox repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate scripts and local hub policies
        run: |
          node --check scripts/ruflo-readonly-facade.mjs
          node --check scripts/ruflo-readonly-facade-smoke.mjs
          npm run validate
          npm test
      - name: Install pinned RuFlo without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Verify facade enforces one read-only native RuFlo lookup
        run: node scripts/ruflo-readonly-facade-smoke.mjs
      - name: Verify no repository modifications
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
