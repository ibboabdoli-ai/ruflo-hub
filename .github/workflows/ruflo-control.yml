name: RuFlo Hub control (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What should the hub do?
        required: true
        type: choice
        options:
          - status
          - installation-smoke
        default: status
      project:
        description: Scope to inspect (not a live connection)
        required: true
        type: choice
        options:
          - hub
          - proffera
        default: hub
  push:
    paths:
      - .github/workflows/ruflo-control.yml
      - scripts/ruflo-control.mjs
      - tests/control.test.mjs

permissions:
  contents: read

concurrency:
  group: ruflo-hub-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  status:
    name: Validate settings and show requested scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUB_OPERATION: ${{ inputs.operation || 'status' }}
      HUB_PROJECT: ${{ inputs.project || 'hub' }}
    steps:
      - name: Checkout hub only (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and test the configuration
        run: |
          npm run validate
          npm test
      - name: Publish read-only status to the workflow summary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ruflo-control.mjs "$HUB_OPERATION" "$HUB_PROJECT" | tee -a "$GITHUB_STEP_SUMMARY"

  isolated-smoke:
    name: Install and verify Ruflo in disposable environment
    needs: status
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'installation-smoke' && inputs.project == 'hub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      RUFLO_VERSION: '3.56.10'
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout hub only (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Ruflo in disposable runner storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ruflo-install"
          npm install --prefix "${RUNNER_TEMP}/ruflo-install" --no-save --no-audit --no-fund --ignore-scripts "ruflo@${RUFLO_VERSION}"
          test -x "${RUNNER_TEMP}/ruflo-install/node_modules/.bin/ruflo"
          echo "RUFLO_BIN=${RUNNER_TEMP}/ruflo-install/node_modules/.bin/ruflo" >> "${GITHUB_ENV}"
      - name: Smoke test in unrelated scratch project
        run: node scripts/ruflo-smoke.mjs
      - name: Confirm no repository file was modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Record smoke result
        shell: bash
        run: |
          echo "## RuFlo smoke test passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Version 3.56.10 initialized in disposable workspace without AI API credentials." >> "$GITHUB_STEP_SUMMARY"
          echo "This did NOT start live agents, connect to any other repository, or run a persistent service." >> "$GITHUB_STEP_SUMMARY"
