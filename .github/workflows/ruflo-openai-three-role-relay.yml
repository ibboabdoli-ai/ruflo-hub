name: RuFlo lab - OpenAI 3-role bounded fixture relay
on:
  push:
    branches:
      - work/ruflo-three-agent-lab-20261018
    paths:
      - scripts/ruflo-openai-three-role-relay.mjs
      - .github/workflows/ruflo-openai-three-role-relay.yml
permissions:
  contents: read
jobs:
  synthetic-relay:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ibboabdoli-ai/ruflo-hub' &&
      github.ref == 'refs/heads/work/ruflo-three-agent-lab-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      RUFLO_VERSION: "3.56.10"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      ANTHROPIC_API_KEY: ""
      OPENROUTER_API_KEY: ""
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
      VERCEL_TOKEN: ""
    steps:
      - name: Checkout only the RuFlo lab without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned RuFlo without API key or install scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          test -x "$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Register RuFlo roles and run three capped artificial OpenAI calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ruflo-openai-three-role-relay.mjs
      - name: Ensure source remained unmodified
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
