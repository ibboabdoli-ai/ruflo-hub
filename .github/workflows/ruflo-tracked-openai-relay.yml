name: RuFlo - tracked synthetic OpenAI three-role handoffs
on:
  push:
    branches: [work/ruflo-three-agent-lab-20261018]
    paths:
      - scripts/ruflo-tracked-openai-relay.mjs
      - .github/workflows/ruflo-tracked-openai-relay.yml
permissions:
  contents: read
jobs:
  tracked-relay:
    if: >-
      github.repository == 'ibboabdoli-ai/ruflo-hub' &&
      github.ref == 'refs/heads/work/ruflo-three-agent-lab-20261018' &&
      contains(github.event.head_commit.message, '[run-paid-ruflo-tracked-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUFLO_VERSION: '3.56.10'
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - name: Checkout only synthetic RuFlo lab without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate lab before exposing provider key
        run: |
          node --check scripts/ruflo-tracked-openai-relay.mjs
          npm run validate
          npm test
      - name: Install RuFlo without credentials or lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ruflo"
          npm install --prefix "$RUNNER_TEMP/ruflo" --no-save --ignore-scripts --no-audit --no-fund "ruflo@$RUFLO_VERSION"
          echo "RUFLO_BIN=$RUNNER_TEMP/ruflo/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Run three bounded OpenAI calls and verify RuFlo task completion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ruflo-tracked-openai-relay.mjs
      - name: Verify checked-out code was never changed
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
