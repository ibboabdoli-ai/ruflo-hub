name: RuFlo - Receipt AI read-only pilot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ruflo-receipt-pilot.yml
      - scripts/ruflo-receipt-pilot.mjs
      - profiles/ibbo-receipt-ai.json
permissions:
  contents: read
concurrency:
  group: ruflo-receipt-pilot
  cancel-in-progress: false
jobs:
  ruflo-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUFLO_VERSION: '3.56.10'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - name: Checkout only Ruflo Hub, without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout public Receipt AI pinned commit
        uses: actions/checkout@v4
        with:
          repository: ibboabdoli-ai/Ibbo_Receipt_AI
          ref: fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2
          path: target-receipt
          persist-credentials: false
      - name: Confirm pinned Receipt AI HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target-receipt rev-parse HEAD)" = "fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2"
      - name: Use Node.js 22 for RuFlo
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned RuFlo with lifecycle scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ruflo-install"
          npm install --prefix "${RUNNER_TEMP}/ruflo-install" --no-save --no-audit --no-fund --ignore-scripts "ruflo@${RUFLO_VERSION}"
          test -x "${RUNNER_TEMP}/ruflo-install/node_modules/.bin/ruflo"
          echo "RUFLO_BIN=${RUNNER_TEMP}/ruflo-install/node_modules/.bin/ruflo" >> "${GITHUB_ENV}"
      - name: Inspect receipt source in disposable copy using RuFlo
        run: node scripts/ruflo-receipt-pilot.mjs target-receipt
      - name: Confirm Hub source unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  receipt-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      TURSO_DATABASE_URL: ''
      TURSO_AUTH_TOKEN: ''
      BLOB_READ_WRITE_TOKEN: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout public Receipt AI pinned commit only
        uses: actions/checkout@v4
        with:
          repository: ibboabdoli-ai/Ibbo_Receipt_AI
          ref: fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2"
      - name: Use project-required Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without running package install scripts
        shell: bash
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run local unit tests, no external services
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Summary
        shell: bash
        run: |
          echo "## Receipt AI source checks" >> "${GITHUB_STEP_SUMMARY}"
          echo "Pinned public commit \`fa9ff4aecabdaeb05f2be54d4b7d649086d0fdd2\`: tests, TypeScript and lint passed." >> "${GITHUB_STEP_SUMMARY}"
          echo "No build/deploy/database/provider calls were attempted." >> "${GITHUB_STEP_SUMMARY}"
