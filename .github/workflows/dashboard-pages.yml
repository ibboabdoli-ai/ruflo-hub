name: Publish RuFlo read-only dashboard to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruflo-dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout only the reviewed dashboard from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject links and unapproved dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dashboard/index.html
          test -f dashboard/app.js
          test -f dashboard/style.css
          test -z "$(find dashboard -type l -print -quit)"
          test -z "$(find dashboard -type f ! -name 'index.html' ! -name 'app.js' ! -name 'style.css' ! -name 'README.md' -print -quit)"
      - name: Configure existing GitHub Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package static dashboard only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dashboard
      - name: Deploy static dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
