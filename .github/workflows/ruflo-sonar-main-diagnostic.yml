name: Diagnose public SonarCloud main findings (read only)
on:
  push:
    branches: [work/ruflo-sonar-main-dashboard-20261024]
    paths:
      - .github/workflows/ruflo-sonar-main-diagnostic.yml
permissions:
  contents: read
jobs:
  public-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public SonarCloud issue metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json
          params=urllib.parse.urlencode({'componentKeys':'ibboabdoli-ai_ruflo-hub','branch':'main','ps':'100','types':'VULNERABILITY','resolved':'false'})
          url='https://sonarcloud.io/api/issues/search?'+params
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ruflo-main-readonly-diagnostic'})
          try:
              with urllib.request.urlopen(req,timeout=12) as rsp:
                  data=json.loads(rsp.read(250000))
          except urllib.error.HTTPError as err:
              print('SONAR_NOT_VERIFIED_HTTP',err.code)
              raise SystemExit(0)
          except Exception as err:
              print('SONAR_NOT_VERIFIED',type(err).__name__)
              raise SystemExit(0)
          print('SONAR_COUNT',data.get('total'))
          for issue in data.get('issues',[])[:40]:
              data_row={k:issue.get(k) for k in ('rule','component','line','message','severity','type','status','impacts')}
              print('SONAR_ISSUE',json.dumps(data_row,ensure_ascii=True)[:1800])
          PY
