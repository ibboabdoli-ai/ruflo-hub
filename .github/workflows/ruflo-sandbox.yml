name: RuFlo isolated installation smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ruflo-sandbox.yml
      - scripts/ruflo-smoke.mjs
      - docs/RUFLO-LAB.fa.md

permissions:
  contents: read

concurrency:
  group: ruflo-install-smoke
  cancel-in-progress: false

jobs:
  install-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      RUFLO_VERSION: "3.56.10"
      RUFLO_BIN: ${{ runner.temp }}/ruflo-install/node_modules/.bin/ruflo
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OLLAMA_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Check out only RuFlo Hub (no push credential)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned RuFlo in disposable runner directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ruflo-install"
          npm install --prefix "${RUNNER_TEMP}/ruflo-install" --no-save --no-audit --no-fund --ignore-scripts "ruflo@${RUFLO_VERSION}"
          test -x "${RUFLO_BIN}"
      - name: Verify executable and initialize disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ruflo-smoke.mjs
      - name: Ensure source repo remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
