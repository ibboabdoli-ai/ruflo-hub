name: Proffera-like booking fixture - zero-key RuFlo isolated experiment
on:
  push:
    branches:
      - work/proffera-booking-offline-20261103
    paths:
      - benchmarks/offline/bench.mjs
      - benchmarks/offline/proffera-booking/**
      - tests/proffera-booking-offline.test.mjs
      - .github/workflows/ruflo-proffera-booking-zero-key.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-booking-only:
    if: github.repository == 'ibboabdoli-ai/ruflo-hub' && github.ref == 'refs/heads/work/proffera-booking-offline-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_API_KEY: ''
      CODEX_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      VERCEL_TOKEN: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DATABASE_URL: ''
      BLOB_READ_WRITE_TOKEN: ''
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout ONLY public RuFlo Hub, no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate synthetic scenario and existing repository tests
        shell: bash
        run: |
          set -euo pipefail
          node --check benchmarks/offline/bench.mjs
          node --check benchmarks/offline/proffera-booking/fixture.mjs
          node --check benchmarks/offline/proffera-booking/reference.mjs
          npm run validate
          npm test
      - name: Compare direct static reference repair (no AI)
        run: node benchmarks/offline/bench.mjs direct booking
      - name: Install exact pinned experimental RuFlo task-bookkeeping dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isolated-ruflo-booking"
          cp benchmarks/offline/deps/package.json benchmarks/offline/deps/package-lock.json "$RUNNER_TEMP/isolated-ruflo-booking/"
          cd "$RUNNER_TEMP/isolated-ruflo-booking"
          echo "8ad21bc4f4a95d756cd9bcfae962625f2e7f03881c7719e25443f73ddbabcc44  package-lock.json" | sha256sum --check
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/ruflo
          echo "RUFLO_BIN=$RUNNER_TEMP/isolated-ruflo-booking/node_modules/.bin/ruflo" >> "$GITHUB_ENV"
      - name: Known vulnerability audit of installed non-optional dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/isolated-ruflo-booking"
          npm audit --omit=dev --omit=optional --json > "$RUNNER_TEMP/ruflo-booking-audit.json" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ruflo-booking-audit.json','utf8'));
          if(a.error||!a.metadata?.vulnerabilities)throw Error('npm audit unavailable: fail closed');
          const v=a.metadata.vulnerabilities;
          console.log('BOOKING_DEP_AUDIT '+JSON.stringify(v));
          if((v.high||0)+(v.critical||0)>0)
            throw Error('Lab paused: high/critical dependency advisory');
          NODE
      - name: Exercise real RuFlo MCP researcher coder tester task bookkeeping against static booking fixture
        run: node benchmarks/offline/bench.mjs ruflo booking
      - name: Declare experimental-only and known Zod limitation
        shell: bash
        run: |
          {
            echo '## Lab limitations'
            echo 'Only static synthetic data. No Proffera clone, no private code, no bookings, no Supervisor, no provider calls.'
            echo 'RuFlo tasks are registered/assigned/completed by the harness; NO autonomous AI agents or Codex coding were tested.'
            echo 'This intentionally pinned lab tree overrides Zod 3 with 4.6.7 and is KNOWN incompatible with some upstream runtime validators.'
            echo 'Do NOT deploy or merge into main; see ruflo-hub issue #11 and Draft PR #10.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify no repository modifications
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
